<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переход в Telegram</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #333; }
        p { color: #666; margin-bottom: 25px; font-size: 16px; line-height: 1.5; }
        .btn {
            display: inline-block;
            background-color: #0088cc;
            color: white;
            padding: 16px 32px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 18px;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ПП-меню | Здоровое питание</h1>
        <p>Нажмите на кнопку ниже, чтобы перейти в Telegram-бот и получить бесплатный гайд с рецептами.</p>
        <!-- Теперь кнопка использует обычную веб-ссылку -->
        <a href="https://t.me/pp_menu_helper_bot" class="btn">Открыть в Telegram</a>
    </div>
</body>
</html>
