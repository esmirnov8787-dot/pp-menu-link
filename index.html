<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переход в Telegram</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #333; }
        p { color: #666; margin-bottom: 25px; font-size: 16px; line-height: 1.5; }
        .btn {
            display: inline-block;
            background-color: #0088cc;
            color: white;
            padding: 16px 32px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 18px;
            border: none;
            width: 100%;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #006699; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ПП-меню | Здоровое питание</h1>
        <p>Нажмите на кнопку ниже, чтобы перейти в Telegram-бот и получить бесплатный гайд с рецептами.</p>
        <a href="tg://resolve?domain=pp_menu_helper_bot" class="btn" id="tgLink">Открыть в Telegram</a>
        <p style="margin-top: 20px; font-size: 13px; color: #999;">Если приложение не открылось, <a href="https://t.me/pp_menu_helper_bot" style="color: #0088cc;">нажмите сюда</a>.</p>
    </div>

    <script>
        document.getElementById('tgLink').addEventListener('click', function(e) {
            e.preventDefault();
            
            var tgLink = "tg://resolve?domain=pp_menu_helper_bot";
            var webLink = "https://t.me/pp_menu_helper_bot";
            
            var now = new Date().getTime();
            var timeout = 1500;
            
            window.location.href = tgLink;
            
            setTimeout(function() {
                if (new Date().getTime() - now > timeout) {
                    window.location.href = webLink;
                }
            }, timeout);
        });
    </script>
</body>
</html>
